name: Publish to npm

on:
  push:
    tags:
      - 'v*'  # e.g. v2.2.0; you can change this trigger later if you prefer main pushes

permissions:
  id-token: write      # required for npm trusted publishing via OIDC [web:7]
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # or another LTS of your choice

      - name: Upgrade npm (trusted publishing requirement)
        run: npm install -g npm@latest  # ensures npm >= 11.5.1 [web:7][web:4]

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm (Trusted Publishing)
        env:
          NPM_CONFIG_PROVENANCE: 'true'  # redundant with publishConfig.provenance, but safe [web:7]
        run: npm publish --access public --provenance
