<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Advanced Javascript — Teardown & Re-init</title>
    <link rel="stylesheet" href="../../../dist/timeline.min.css">
    <link rel="stylesheet" href="../../assets/css/demo.css">
  </head>
  <body>

    <div class="wrapper">
      <header class="demo-page-head" style="margin-bottom: 40px;">
        <h1>Teardown & Re-init</h1>
        <p>This page demonstrates how to safely remove and recreate a timeline instance programmatically. Click the buttons below to destroy/re-initialize the timeline.</p>
        <p>View the page source and read the Javascript code to see how it was done.</p>
      </header>

      <section>
        <div id="teardown-tl" class="timeline" data-test="teardown-tl"></div>
        <p class="center">
          <button id="btn-destroy" class="btn danger" data-test="teardown-destroy">Destroy Timeline</button>
          <button id="btn-reinit" class="btn success" data-test="teardown-reinit">Re-initialize Timeline</button>
        </p>
      </section>

      <footer style="margin: 40px 0 100px 0;">
        <a class="btn" href="index.html">❮ Back to Advanced Javascript Examples</a>
      </footer>

    </div>

    <script src="../../../dist/timeline.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {

        var REINIT_FLAG = 'teardown-reinit-requested';
        var pendingReinit = localStorage.getItem(REINIT_FLAG) === '1';

        var items = [
          { id: 1, title: 'A', content: 'Alpha' },
          { id: 2, title: 'B', content: 'Beta' },
          { id: 3, title: 'C', content: 'Gamma' }
        ];

        function init() {
          timelineFromData('#teardown-tl', items, { mode: 'horizontal', minWidth: 600 });
          console.log('timeline initialized');
        }

        function destroy(showAlert) {
          var el = document.querySelector('#teardown-tl');
          // Basic teardown: remove inner HTML and any global state if needed
          el.innerHTML = '';
          console.log('timeline destroyed (DOM cleared)');
          if (showAlert) {
            alert('Timeline has been destroyed.\nWhen you click OK, it will disappear from the DOM\nClick "Re-initialize Timeline" to bring it back.');
          }
        }

        document.getElementById('btn-destroy').addEventListener('click', function () {
          destroy(true);
        });

        document.getElementById('btn-reinit').addEventListener('click', function () {
          destroy(false);
          alert('Re-initializing the timeline...');
          // We want a one-time re-init to avoid reload loops
          localStorage.setItem(REINIT_FLAG, '1');
          location.reload();
        });

        if (pendingReinit) {
          localStorage.removeItem(REINIT_FLAG);
          alert('Page reload needed: after you click OK, the page will reload and the timeline will appear in the DOM with the correct CSS styling applied.');
        }

        init();
      });
    </script>

  </body>
</html>
